name: SJCW Hey Mate APK
on:
  push:
    branches:
      - feature/hey-mate-voice-launcher
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile APK
        run: gradle --no-daemon -p hey-mate :app:assembleDebug
      - name: Package APK
        run: cp hey-mate/app/build/outputs/apk/debug/app-debug.apk SJCW-Hey-Mate-v1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SJCW-Hey-Mate-APK
          path: SJCW-Hey-Mate-v1.apk
