name: Build UK Sewer Atlas APK
on:
  push:
    branches:
      - uk-sewer-atlas
    paths:
      - 'sewer-atlas/**'
      - '.github/workflows/uk-sewer-atlas.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout atlas branch
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 and build tools
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Configure Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Print toolchain versions
        shell: bash
        run: |
          java -version
          gradle --version
          test -f sewer-atlas/app/src/main/assets/index.html
          test -f sewer-atlas/settings.gradle
      - name: Compile Android APK with compiler diagnostics
        working-directory: sewer-atlas
        run: gradle --no-daemon --stacktrace --info :app:assembleDebug
      - name: Validate APK content
        shell: bash
        run: |
          set -euxo pipefail
          APK='sewer-atlas/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -F 'assets/index.html'
          unzip -l "$APK" | grep -F 'classes.dex'
          sha256sum "$APK"
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SJCW-UK-Sewer-Atlas-APK
          path: sewer-atlas/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
