name: Build UK Sewer Atlas APK
on:
  push:
    branches: [uk-sewer-atlas]
    paths: ['sewer-atlas/**', '.github/workflows/uk-sewer-atlas.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile installable debug APK
        working-directory: sewer-atlas
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK
        run: |
          test -s sewer-atlas/app/build/outputs/apk/debug/app-debug.apk
          unzip -l sewer-atlas/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.html'
      - uses: actions/upload-artifact@v4
        with:
          name: SJCW-UK-Sewer-Atlas-APK
          path: sewer-atlas/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
