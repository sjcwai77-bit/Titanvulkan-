name: Build SJCW Torrent APK
on:
  push:
    branches: [torrent-client]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify magnet parser with JVM tests
        run: |
          mkdir -p build/magnet-test
          javac -d build/magnet-test SJCW-Torrent/app/src/main/java/app/sjcw/torrent/MagnetParser.java SJCW-Torrent/tests/MagnetParserTest.java
          java -ea -cp build/magnet-test app.sjcw.torrent.MagnetParserTest
      - name: Assemble APK
        run: gradle --no-daemon -p SJCW-Torrent assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SJCW-Torrent-APK
          path: SJCW-Torrent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK file
        run: |
          mkdir -p apk
          cp SJCW-Torrent/app/build/outputs/apk/debug/app-debug.apk apk/SJCW-Torrent-2.1-FIX.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add apk/SJCW-Torrent-2.1-FIX.apk
          git commit -m "Publish installable torrent APK [skip ci]"
          git push origin HEAD:torrent-client
