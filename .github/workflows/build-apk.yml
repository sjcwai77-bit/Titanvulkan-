name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "source_parts/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Reconstruct Titanic Vulkan source
        shell: bash
        run: |
          set -euo pipefail
          cat source_parts/part*.b64 > TitanicVulkanAndroid_Source.zip.b64
          base64 --decode TitanicVulkanAndroid_Source.zip.b64 > TitanicVulkanAndroid_Source.zip
          unzip -q TitanicVulkanAndroid_Source.zip
          test -f TitanicVulkanAndroid/settings.gradle
          test -f TitanicVulkanAndroid/app/src/main/cpp/vulkan_renderer.cpp
          python3 - <<'PY'
          from pathlib import Path
          p = Path("TitanicVulkanAndroid/app/build.gradle")
          s = p.read_text()
          deps = [
              "    implementation 'androidx.core:core:1.17.0'\n",
              "    implementation 'androidx.appcompat:appcompat:1.7.1'\n",
          ]
          for dep in reversed(deps):
              marker = dep.split("'")[1].split(":")[1]
              if marker not in s:
                  s = s.replace("dependencies {\n", "dependencies {\n" + dep)
          p.write_text(s)

          # GameActivity derives from AppCompatActivity, so it must use an
          # AppCompat-based theme. The original platform Theme.Material causes
          # an immediate crash in AppCompatActivity.onCreate().
          manifest = Path("TitanicVulkanAndroid/app/src/main/AndroidManifest.xml")
          m = manifest.read_text()
          m = m.replace(
              'android:theme="@android:style/Theme.Material.NoActionBar.Fullscreen"',
              'android:theme="@style/Application.Fullscreen"'
          )
          manifest.write_text(m)

          values = Path("TitanicVulkanAndroid/app/src/main/res/values")
          values.mkdir(parents=True, exist_ok=True)
          (values / "themes.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Application.Fullscreen" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowContentOverlay">@null</item>
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="windowActionModeOverlay">true</item>
                  <item name="windowNoTitle">true</item>
              </style>
          </resources>
          """)
          PY

      - name: Compile Vulkan shaders to SPIR-V
        shell: bash
        run: |
          set -euo pipefail
          GLSLC="${ANDROID_HOME}/ndk/28.2.13676358/shader-tools/linux-x86_64/glslc"
          test -x "$GLSLC"
          mkdir -p TitanicVulkanAndroid/app/src/main/assets/shaders
          "$GLSLC" -O TitanicVulkanAndroid/app/src/main/shaders/scene.vert \
            -o TitanicVulkanAndroid/app/src/main/assets/shaders/scene.vert.spv
          "$GLSLC" -O TitanicVulkanAndroid/app/src/main/shaders/scene.frag \
            -o TitanicVulkanAndroid/app/src/main/assets/shaders/scene.frag.spv
          test -s TitanicVulkanAndroid/app/src/main/assets/shaders/scene.vert.spv
          test -s TitanicVulkanAndroid/app/src/main/assets/shaders/scene.frag.spv

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        working-directory: TitanicVulkanAndroid
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify shaders are packaged
        shell: bash
        run: |
          set -euo pipefail
          APK="TitanicVulkanAndroid/app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK" | grep -q "assets/shaders/scene.vert.spv"
          unzip -l "$APK" | grep -q "assets/shaders/scene.frag.spv"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Titanic-Vulkan-APK
          path: TitanicVulkanAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
