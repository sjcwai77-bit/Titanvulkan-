name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "source_parts/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Reconstruct Titanic Vulkan source
        shell: bash
        run: |
          set -euo pipefail
          cat source_parts/part*.b64 > TitanicVulkanAndroid_Source.zip.b64
          base64 --decode TitanicVulkanAndroid_Source.zip.b64 > TitanicVulkanAndroid_Source.zip
          unzip -q TitanicVulkanAndroid_Source.zip
          test -f TitanicVulkanAndroid/settings.gradle
          test -f TitanicVulkanAndroid/app/src/main/cpp/vulkan_renderer.cpp
          python3 - <<'PY'
          from pathlib import Path
          p = Path("TitanicVulkanAndroid/app/build.gradle")
          s = p.read_text()
          dep = "    implementation 'androidx.core:core:1.17.0'\n"
          if "androidx.core:core:" not in s:
              s = s.replace("dependencies {\n", "dependencies {\n" + dep)
              p.write_text(s)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        working-directory: TitanicVulkanAndroid
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Titanic-Vulkan-APK
          path: TitanicVulkanAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
