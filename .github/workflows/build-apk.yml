name: Build Titanic Vulkan Build 2

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "build2_overlay/**"
      - "stars.inc"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;28.2.13676358"             "cmake;3.22.1"

      - name: Reconstruct known-good Vulkan base
        shell: bash
        run: |
          set -euo pipefail
          cat source_parts/part*.b64 > TitanicVulkanAndroid_Source.zip.b64
          base64 --decode TitanicVulkanAndroid_Source.zip.b64 > TitanicVulkanAndroid_Source.zip
          unzip -q TitanicVulkanAndroid_Source.zip
          test -f TitanicVulkanAndroid/app/src/main/cpp/vulkan_renderer.cpp
          test -f TitanicVulkanAndroid/app/src/main/cpp/titanic_scene.cpp

      - name: Apply Build 2 makeover
        shell: bash
        run: |
          set -euo pipefail
          cp build2_overlay/main.cpp TitanicVulkanAndroid/app/src/main/cpp/main.cpp
          cp build2_overlay/titanic_scene.hpp TitanicVulkanAndroid/app/src/main/cpp/titanic_scene.hpp
          cp build2_overlay/MainActivity.java TitanicVulkanAndroid/app/src/main/java/com/sjcw/titanicvulkan/MainActivity.java
          cp build2_overlay/app_build.gradle TitanicVulkanAndroid/app/build.gradle
          cp build2_overlay/scene.vert TitanicVulkanAndroid/app/src/main/shaders/scene.vert
          cp build2_overlay/scene.frag TitanicVulkanAndroid/app/src/main/shaders/scene.frag
          cp stars.inc TitanicVulkanAndroid/app/src/main/cpp/stars.inc

          mkdir -p TitanicVulkanAndroid/app/src/main/res/values
          cat > TitanicVulkanAndroid/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Application.Fullscreen" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowContentOverlay">@null</item>
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="windowActionModeOverlay">true</item>
                  <item name="windowNoTitle">true</item>
              </style>
          </resources>
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p=Path("TitanicVulkanAndroid/app/src/main/AndroidManifest.xml")
          s=p.read_text().replace(
              "@android:style/Theme.Material.NoActionBar.Fullscreen",
              "@style/Application.Fullscreen"
          )
          p.write_text(s)
          PY

          cd TitanicVulkanAndroid
          patch -p1 < ../build2_overlay/scene.patch
          patch -p1 < ../build2_overlay/renderer.patch

      - name: Compile Vulkan shaders to SPIR-V
        shell: bash
        run: |
          set -euo pipefail
          GLSLC="${ANDROID_HOME}/ndk/28.2.13676358/shader-tools/linux-x86_64/glslc"
          test -x "$GLSLC"
          mkdir -p TitanicVulkanAndroid/app/src/main/assets/shaders
          "$GLSLC" -O TitanicVulkanAndroid/app/src/main/shaders/scene.vert             -o TitanicVulkanAndroid/app/src/main/assets/shaders/scene.vert.spv
          "$GLSLC" -O TitanicVulkanAndroid/app/src/main/shaders/scene.frag             -o TitanicVulkanAndroid/app/src/main/assets/shaders/scene.frag.spv
          test -s TitanicVulkanAndroid/app/src/main/assets/shaders/scene.vert.spv
          test -s TitanicVulkanAndroid/app/src/main/assets/shaders/scene.frag.spv

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build ARM64 APK
        working-directory: TitanicVulkanAndroid
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Build 2 APK
        shell: bash
        run: |
          set -euo pipefail
          APK="TitanicVulkanAndroid/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q "assets/shaders/scene.vert.spv"
          unzip -l "$APK" | grep -q "assets/shaders/scene.frag.spv"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libtitanic_vulkan.so"

      - name: Upload Build 2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Titanic-Vulkan-Build2-APK
          path: TitanicVulkanAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
